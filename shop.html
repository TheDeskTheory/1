<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop — The Desk Theory</title>
<link rel="stylesheet" href="style.css?v=5">
</head>
<body>

<header class="site-header">
  <div class="container">
    <a href="index.html" class="logo"><img src="logo-mark-v2.png" alt="The Desk Theory"><span class="logo-word">The Desk Theory</span></a>
    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="shop.html" class="active">Shop</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
      <a href="cart.html" class="cart-link">Cart <span class="cart-badge">0</span></a>
    </nav>
  </div>
</header>

<section class="section" style="padding-top:50px;">
  <div class="container">
    <span class="eyebrow">Full catalog</span>
    <h1 style="font-size:clamp(2rem,5vw,3rem);">The Shop</h1>
    <p style="max-width:480px; margin-top:12px;">Posters, in small batches.</p>
  </div>
</section>

<section class="section">
  <div class="container">
    <div class="grid" id="shop-grid"></div>
  </div>
</section>

<footer class="site-footer">
  <div class="container" style="display:flex; justify-content:space-between; flex-wrap:wrap; gap:12px; width:100%;">
    <span>&copy; 2026 The Desk Theory</span>
    <a href="https://www.instagram.com/the.desk.theory/" target="_blank" rel="noopener" class="footer-insta">Follow us on Instagram</a>
    <span>Made for our BBA group assignment</span>
  </div>
</footer>

<script src="products.js"></script>
<script src="cart.js"></script>
<script>
  const grid = document.getElementById("shop-grid");

  function renderCard(p) {
    const card = document.createElement("div");
    card.className = "product-card";
    card.dataset.cat = p.category;
    card.style.setProperty("--rot", p.rot + "deg");
    const artInner = p.image
      ? `<img src="${p.image}" alt="${p.name}" style="width:100%; height:100%; object-fit:cover;">`
      : `<span class="glyph">P</span>`;
    const artBg = p.image ? "none" : `linear-gradient(135deg, ${p.colors[0]}, ${p.colors[1]})`;
    card.innerHTML = `
      <div class="sticker-art" style="background: ${artBg};">
        ${artInner}
        <div class="peel"></div>
      </div>
      <div class="product-info">
        <h3>${p.name}</h3>
        <p class="desc">${p.desc}</p>
        <div class="product-row">
          <span class="price">₹${p.price}</span>
          <button class="btn small" data-add="${p.id}">Add</button>
        </div>
      </div>
    `;
    return card;
  }

  function draw() {
    grid.innerHTML = "";
    PRODUCTS.forEach(p => grid.appendChild(renderCard(p)));
  }

  draw();

  document.addEventListener("click", (e) => {
    if (e.target.dataset && e.target.dataset.add) {
      addToCart(e.target.dataset.add);
      e.target.textContent = "Added";
      setTimeout(() => (e.target.textContent = "Add"), 900);
    }
  });
</script>
</body>
</html>
